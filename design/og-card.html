<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #2b3a45;
    color: #ece5d8;
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
  }
  .wordmark {
    font-weight: 400;
    font-size: 104px;
    line-height: 1.05;
  }
  .tagline {
    margin-top: 30px;
    font-style: italic;
    font-size: 38px;
    opacity: 0.7;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: #c47a5d;
    margin: 48px 0 44px;
  }
  .descriptor {
    font-size: 32px;
    line-height: 1.42;
    max-width: 860px;
    text-wrap: balance;
  }
  .accent { color: #c47a5d; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Foxhole Partners</div>
    <div class="tagline">Every leader needs someone in the foxhole.</div>
    <div class="rule"></div>
    <div class="descriptor"><span class="accent">Strategy</span>, <span class="accent">operations</span>, and <span class="accent">communications</span> for companies, campaigns, causes, and the people who lead them.</div>
  </div>
</body>
</html>
